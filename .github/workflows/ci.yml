name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24', '26']
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:types
      # Node 20 has neither the --test-coverage-* threshold flags nor glob
      # expansion for test paths; both arrived in Node 22.
      - run: npm run coverage
        if: matrix.node-version != '20'
      - run: node --test test/index.js
        if: matrix.node-version == '20'

  # The test suite uses only node:test, so it runs with no dependencies
  # installed. That lets us check the floor declared in `engines`, which is
  # below what the lint and typecheck toolchain itself supports.
  engines-floor:
    runs-on: ubuntu-latest
    name: Node 18 (no dev dependencies)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: node --test test/index.js

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
